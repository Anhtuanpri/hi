<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <script>
    const password = prompt("🔐 Nhập mật khẩu Admin:");
    if (password !== "1") {
      document.body.innerHTML = "<h2 style='color:white; text-align:center; padding-top: 100px;'>❌ Sai mật khẩu. Truy cập bị từ chối.</h2>";
      throw new Error("Unauthorized access");
    }
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1f1f1f, #2a2a2a);
      color: white;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .comment {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .comment button {
      margin-top: 8px;
      padding: 6px 10px;
      border: none;
      background-color: crimson;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>📋 Admin – Quản lý bình luận</h1>
  <div id="admin-comments"></div>

  <script type="module" src="admin.js"></script>
</body>
</html>
