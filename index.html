<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bình luận</title>
  <style>
    body {
      background: url('https://i.imgur.com/nl5YVfY.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial;
      color: white;
    }
    .comment-box, .reply-box {
      background-color: rgba(0,0,0,0.5);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    .reply-box {
      margin-left: 0; /* không thụt lề */
      border-left: 2px solid rgba(255,255,255,0.2);
    }
    .comment-header {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 10px;
    }
    .reply-btn, .delete-btn {
      cursor: pointer;
      font-size: 12px;
      color: lightblue;
      margin-left: 10px;
    }
    .like-btn {
      cursor: pointer;
      font-size: 12px;
      color: lightgreen;
      margin-left: 10px;
    }
    .reply-input {
      display: none;
      margin-top: 5px;
    }
    .show-replies {
      cursor: pointer;
      font-size: 12px;
      margin-top: 5px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="comment-box">
    <textarea id="commentInput" placeholder="Nhập bình luận..." rows="2" style="width:100%;"></textarea>
    <button onclick="postComment()">Gửi</button>
  </div>
  <div id="commentsContainer"></div>

  <script type="module" src="comment.js"></script>
</body>
</html>
