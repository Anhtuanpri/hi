<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Tối Thượng</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712027.png" />
</head>
<body>
  <div id="chatContainer" class="glass">
    <header>
      <h2>💬 Huyền Cửu Thiên Chat</h2>
    </header>

    <ul id="messagesUl"></ul>

    <div class="input-area">
      <input type="file" id="imageInput" accept="image/*" hidden />
      <button onclick="imageInput.click()">🖼️</button>
      <button onclick="emojiPicker.classList.toggle('show')">😊</button>
      <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." />
      <button id="sendBtn">Gửi</button>
      <button id="clearBtn">🗑️</button>
    </div>

    <div id="emojiPicker"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
