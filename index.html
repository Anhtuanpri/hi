<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bình luận</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      color: #fff;
    }

    .comment-container {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
    }

    .comment-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .comment-form input,
    .comment-form textarea {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .comment-form button {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      background-color: #4caf50;
      color: white;
      cursor: pointer;
    }

    .comment {
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .comment-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }

    .comment-content {
      margin-top: 5px;
      padding-left: 46px;
    }

    .reply-button,
    .delete-button,
    .like-button {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      margin-top: 5px;
      margin-right: 10px;
      font-size: 13px;
    }

    .reply-form {
      margin-top: 10px;
      margin-left: 40px;
      display: none;
      flex-direction: column;
      gap: 5px;
    }

    .reply-container {
      margin-left: 40px;
    }
  </style>
</head>
<body>
  <div class="comment-container">
    <div class="comment-form">
      <input type="text" id="nameInput" placeholder="Tên bạn" />
      <input type="text" id="avatarInput" placeholder="Link ảnh avatar" />
    </div>
    <div class="comment-form">
      <textarea id="commentInput" placeholder="Viết bình luận..." rows="2"></textarea>
      <button onclick="postComment()">Gửi</button>
    </div>
    <div id="commentList"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="comment.js"></script>
</body>
</html>
