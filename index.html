<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Huyền Cửu Thiên - Chat Tiên Giới</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🌌 Chat Tiên Giới</h1>
    <button id="clearBtn" title="Xoá tất cả">🗑</button>
  </header>

  <main id="chat-container">
    <ul id="messages"></ul>
  </main>

  <footer>
    <button class="icon-btn" id="emojiBtn">😊</button>
    <input type="file" id="imageInput" accept="image/*" hidden />
    <button class="icon-btn" id="imageBtn" title="Gửi ảnh">🖼</button>
    <input type="text" id="messageInput" placeholder="Nhập lời tiên tri..." />
    <button class="icon-btn" id="sendBtn" title="Gửi">📨</button>
  </footer>

  <div id="emojiPicker" class="hidden"></div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js"></script>
  <script src="script.js" type="module"></script>
</body>
</html>
